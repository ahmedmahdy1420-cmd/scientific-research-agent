name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  # CI never has a model provider key: the deterministic offline provider is
  # what makes the whole suite runnable here.
  LLM_PROVIDER: fake
  ENVIRONMENT: test

jobs:
  # ---------------------------------------------------------------------------
  lint:
    name: Lint and type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Ruff lint
        run: ruff check . --output-format=github

      - name: Ruff format check
        run: ruff format --check .

      - name: mypy
        run: mypy app mock_services

  # ---------------------------------------------------------------------------
  test:
    name: Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        # pgvector must be present: the schema has a vector column and an HNSW
        # index, so a plain postgres image cannot run these tests.
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: research
          POSTGRES_PASSWORD: research
          POSTGRES_DB: research
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U research"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgresql+psycopg://research:research@localhost:5432/research
      DATABASE_READONLY_URL: postgresql+psycopg://research:research@localhost:5432/research
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET: ci-secret-that-is-comfortably-longer-than-32-chars
      LOG_LEVEL: WARNING

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Verify migrations match the models
        # Catches a model change committed without a migration, which would
        # otherwise only fail at deploy time.
        run: |
          alembic upgrade head
          alembic check

      - name: Unit tests
        run: pytest tests/unit -v --cov=app --cov-report=term-missing

      - name: Integration tests
        run: pytest tests/integration -v --cov=app --cov-append --cov-report=xml

      - name: Coverage summary
        run: |
          pip install coverage
          coverage report --skip-covered | tail -25

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage.xml
          retention-days: 7

  # ---------------------------------------------------------------------------
  evaluation:
    name: Agent evaluation suite
    runs-on: ubuntu-latest
    needs: test

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: research
          POSTGRES_PASSWORD: research
          POSTGRES_DB: research
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U research"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgresql+psycopg://research:research@localhost:5432/research
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET: ci-secret-that-is-comfortably-longer-than-32-chars
      LOG_LEVEL: WARNING
      LOG_FORMAT: console
      MCP_ENABLED: "false"
      STORAGE_BACKEND: local
      LOCAL_STORAGE_PATH: ./storage

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Migrate and seed
        run: |
          alembic upgrade head
          python -m scripts.generate_sample_data
          python -m scripts.generate_pdfs
          python -m scripts.seed_data --with-pdfs --skip-generate

      - name: Run the evaluation suites
        # Behaviour regressions - wrong tool chosen, a fabricated citation, a
        # sensitive action that stopped pausing for approval - do not show up
        # in unit tests. This gate is what catches them.
        run: python -m scripts.run_evaluation --all --fail-under 0.9 --no-judge

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evaluation-report
          path: evaluation-report.json
          retention-days: 30

  # ---------------------------------------------------------------------------
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci || npm install
      - run: npm run typecheck
      - run: npm run build

  # ---------------------------------------------------------------------------
  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [lint, test]

    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Build the application image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: scientific-research-agent:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the image
        # Proves the image can import the app and start a worker command, which
        # a build alone does not.
        run: |
          docker run --rm scientific-research-agent:${{ github.sha }} \
            python -c "import app.main; import app.workers.tasks; import app.mcp.server; print('imports OK')"

  # ---------------------------------------------------------------------------
  terraform:
    name: Terraform validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform

    steps:
      - uses: actions/checkout@v5

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false
      - run: terraform validate
