name: Deploy

# Deployment is manual or tag-driven, never an automatic consequence of a
# merge, and it is a no-op unless AWS credentials are actually configured.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        default: staging
        type: choice
        options: [staging, production]
      image_tag:
        description: Image tag to deploy (defaults to the commit SHA)
        required: false
        type: string
  push:
    tags: ["v*"]

concurrency:
  group: deploy-${{ github.event.inputs.environment || 'staging' }}
  cancel-in-progress: false # never cancel a deploy mid-flight

env:
  AWS_REGION: eu-west-1
  PROJECT: scientific-research-agent

permissions:
  id-token: write # OIDC: no long-lived AWS keys in GitHub
  contents: read

jobs:
  guard:
    name: Check deployment is configured
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - id: check
        run: |
          if [ -n "${{ secrets.AWS_DEPLOY_ROLE_ARN }}" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::AWS_DEPLOY_ROLE_ARN is not set; skipping deployment."
          fi

  deploy:
    name: Build, migrate and deploy
    runs-on: ubuntu-latest
    needs: guard
    if: needs.guard.outputs.configured == 'true'
    environment: ${{ github.event.inputs.environment || 'staging' }}

    steps:
      - uses: actions/checkout@v5

      - name: Resolve names
        id: names
        run: |
          ENV="${{ github.event.inputs.environment || 'staging' }}"
          TAG="${{ github.event.inputs.image_tag || github.sha }}"
          echo "env=$ENV"   >> "$GITHUB_OUTPUT"
          echo "tag=$TAG"   >> "$GITHUB_OUTPUT"
          echo "stack=$PROJECT-$ENV" >> "$GITHUB_OUTPUT"

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/${{ steps.names.outputs.stack }}:${{ steps.names.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run database migrations
        # Migrations run as a one-off task and must succeed BEFORE any new
        # application task starts. Running them on container start would race
        # across tasks on the same DDL.
        run: |
          STACK="${{ steps.names.outputs.stack }}"
          SUBNETS=$(aws ecs describe-services --cluster "$STACK" --services "$STACK-api" \
            --query 'services[0].networkConfiguration.awsvpcConfiguration.subnets' --output text | tr '\t' ',')
          SGS=$(aws ecs describe-services --cluster "$STACK" --services "$STACK-api" \
            --query 'services[0].networkConfiguration.awsvpcConfiguration.securityGroups' --output text | tr '\t' ',')

          TASK_ARN=$(aws ecs run-task \
            --cluster "$STACK" \
            --task-definition "$STACK-migrate" \
            --launch-type FARGATE \
            --network-configuration "awsvpcConfiguration={subnets=[$SUBNETS],securityGroups=[$SGS],assignPublicIp=DISABLED}" \
            --query 'tasks[0].taskArn' --output text)

          echo "Migration task: $TASK_ARN"
          aws ecs wait tasks-stopped --cluster "$STACK" --tasks "$TASK_ARN"

          EXIT_CODE=$(aws ecs describe-tasks --cluster "$STACK" --tasks "$TASK_ARN" \
            --query 'tasks[0].containers[0].exitCode' --output text)
          if [ "$EXIT_CODE" != "0" ]; then
            echo "::error::Migrations failed with exit code $EXIT_CODE; not deploying."
            exit 1
          fi

      - name: Deploy services
        run: |
          STACK="${{ steps.names.outputs.stack }}"
          IMAGE="${{ steps.ecr.outputs.registry }}/$STACK:${{ steps.names.outputs.tag }}"

          for service in api worker mcp; do
            OLD=$(aws ecs describe-task-definition --task-definition "$STACK-$service" --query taskDefinition)
            NEW=$(echo "$OLD" | jq --arg IMAGE "$IMAGE" \
              '.containerDefinitions[0].image = $IMAGE
               | del(.taskDefinitionArn, .revision, .status, .requiresAttributes,
                     .compatibilities, .registeredAt, .registeredBy)')
            ARN=$(aws ecs register-task-definition --cli-input-json "$NEW" \
              --query 'taskDefinition.taskDefinitionArn' --output text)
            aws ecs update-service --cluster "$STACK" --service "$STACK-$service" \
              --task-definition "$ARN" >/dev/null
            echo "Updated $STACK-$service -> $ARN"
          done

      - name: Wait for the deployment to stabilise
        # The ECS circuit breaker rolls back automatically on failure; this
        # makes the workflow reflect that outcome instead of reporting success.
        run: |
          STACK="${{ steps.names.outputs.stack }}"
          aws ecs wait services-stable --cluster "$STACK" \
            --services "$STACK-api" "$STACK-worker" "$STACK-mcp"

      - name: Post-deploy smoke test
        run: |
          STACK="${{ steps.names.outputs.stack }}"
          DNS=$(aws elbv2 describe-load-balancers --names "$STACK-alb" \
            --query 'LoadBalancers[0].DNSName' --output text)
          for attempt in $(seq 1 10); do
            if curl -fsS "http://$DNS/api/v1/health"; then
              echo "Health check passed."
              exit 0
            fi
            sleep 10
          done
          echo "::error::Health check never passed after deployment."
          exit 1
