<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#0a0c12" />
    <meta
      name="description"
      content="Scientific Research Agent — an inspectable LangGraph research assistant over pgvector RAG."
    />
    <title>Scientific Research Agent</title>

    <!-- Inline SVG favicon: no extra request, no binary asset in the repo. -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%236d8bff'/%3E%3Cstop offset='1' stop-color='%23c084fc'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='9' fill='url(%23g)'/%3E%3Cpath d='M11 9v6.2a5 5 0 1 0 10 0V9' fill='none' stroke='%230a0c12' stroke-width='2.4' stroke-linecap='round'/%3E%3Cpath d='M9 9h5M18 9h5' stroke='%230a0c12' stroke-width='2.4' stroke-linecap='round'/%3E%3C/svg%3E"
    />

    <!-- Webfonts are progressive enhancement: the stack in styles.css falls
         back to system faces if fonts.googleapis.com is unreachable. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
    />

    <script>
      // Applied before first paint so a light-theme user never sees a dark flash.
      try {
        var stored = localStorage.getItem("sra-theme");
        var system = window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        document.documentElement.dataset.theme = stored || system;
      } catch (_) {
        /* private mode: keep the dark default */
      }
    </script>
  </head>
  <body>
    <div class="aurora" aria-hidden="true"></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
